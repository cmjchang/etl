name: dbt CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dbt-build:
    name: DuckDB Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/dbt/requirements.txt

      - name: Install Pinned Dependencies
        run: python -m pip install -r src/dbt/requirements.txt

      - name: Test Pipeline Failure Gates
        run: python -m unittest discover -s src/dbt/tests -p 'test_*.py' -v

      - name: Build, Test, and Validate Sample Exports
        run: python src/dbt/run_pipeline.py

      - name: Upload dbt Results and Exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-results-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
          path: |
            .artifacts/dbt/
            .artifacts/logs/
            .artifacts/exports/