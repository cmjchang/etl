name: dbt CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dbt-build:
    name: DuckDB Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Set Up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Locked Dependencies
        run: uv sync --locked

      - name: Build and Test Sample Models
        working-directory: src/dbt
        run: |
          mkdir -p ../../.artifacts/exports
          uv run --locked python -m dbt.cli.main build \
            --profiles-dir . \
            --vars '{"source_csv_path":"data/sample_vehicle_registrations.csv","export_dir":"../../.artifacts/exports"}' \
            --target-path ../../.artifacts/dbt \
            --log-path ../../.artifacts/logs

      - name: Upload dbt Results and Exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-results-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
          path: |
            .artifacts/dbt/
            .artifacts/logs/
            .artifacts/exports/