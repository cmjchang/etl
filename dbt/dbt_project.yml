name: vehicle_analytics
version: '1.0.0'
config-version: 2
profile: vehicle_analytics
model-paths: [models]
test-paths: [tests]
macro-paths: [macros]
clean-targets: [target, dbt_packages]
vars:
  source_csv_path: 'data/df_VEH0160_UK.csv'
  export_dir: '../exports/manual'
  ranking_years: [2024, 2025, 2026]
models:
  vehicle_analytics:
    +materialized: table
    ingestion:
      +schema: raw
    staging:
      +schema: staging
    intermediate:
      +schema: intermediate
    marts:
      core:
        +schema: core
      reporting:
        +schema: reporting
    export:
      +schema: vehicle_export
      +materialized: export_file
      +tags: [export]
