version: 2

models:
  - name: int_online_retail__accepted
    description: Valid retail records in event-time order with zero-based Parquet chunk identifiers.
    columns:
      - name: source_row
        data_tests:
          - not_null
          - unique
      - name: batch_id
        data_tests:
          - not_null
      - name: invoice_no
        data_tests:
          - not_null
      - name: stock_code
        data_tests:
          - not_null
      - name: quantity
        data_tests:
          - not_null
      - name: invoice_date
        data_tests:
          - not_null
      - name: unit_price
        data_tests:
          - not_null