name: vehicle_analytics
version: '1.0.0'
config-version: 2
profile: vehicle_analytics
model-paths: [models]
macro-paths: [macros]
test-paths: [tests]
clean-targets: [target, dbt_packages]
vars:
  export_dir: 'exports/'
  nyctlc_end_month: 7
models:
  vehicle_analytics:
    +materialized: table
    ingestion:
      +schema: raw
      +materialized: incremental
      +incremental_strategy: append
      +on_schema_change: append_new_columns
    staging:
      +schema: staging
    intermediate:
      +schema: intermediate
    marts:
      core:
        +schema: core
      reporting:
        +schema: reporting
    export:
      +schema: vehicle_export
      +materialized: export_file
      +tags: [export]
