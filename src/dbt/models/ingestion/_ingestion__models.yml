- name: raw_nyctlc__taxi_zone_lookup
  description: NYC TLC taxi zone lookup CSV mapping LocationID values to borough, zone, and service zone, with source and load metadata.
  config:
    tags:
    - nyc
    - tlc
    - taxi_zone_lookup
    - ingestion
  columns:
  - name: LocationID
    description: TLC Taxi Zone identifier referenced by PULocationID and DOLocationID in the trip models.
    data_tests:
    - not_null
    - unique
  - name: Borough
    description: Borough containing the taxi zone.
  - name: Zone
    description: Taxi zone name.
  - name: service_zone
    description: TLC service zone classification for the taxi zone.
  - name: source_file
    description: URL of the CSV that supplied the record.
    data_tests:
    - not_null
  - name: loaded_at
    description: Timestamp when the record was loaded into the raw model.
    data_tests:
    - not_null
